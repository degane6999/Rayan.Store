server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache long pour les assets statiques hashés par Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA : toute route inconnue renvoie index.html (React Router côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
